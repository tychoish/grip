name: go test
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
    branches:
      - main
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go test
        run: |
          for dir in $(find . -name "go.mod" | xargs dirname); do
            echo "--- PKG $dir/..."
            go test -race $dir/...
          done
